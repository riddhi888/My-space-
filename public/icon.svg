<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#190d33"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)"/>
  
  <!-- Outer Glow Ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#ringGrad)" stroke-width="18" filter="url(#glow)" stroke-linecap="round"/>

  <!-- Center Social Icon (3 Connected Avatars - MySpace Classic Vibe) -->
  <!-- Left Friend -->
  <g transform="translate(170, 270)">
    <circle cx="0" cy="-45" r="32" fill="#06b6d4"/>
    <path d="M -42 28 C -42 -12, 42 -12, 42 28 Z" fill="#06b6d4" opacity="0.85"/>
  </g>

  <!-- Right Friend -->
  <g transform="translate(342, 270)">
    <circle cx="0" cy="-45" r="32" fill="#a855f7"/>
    <path d="M -42 28 C -42 -12, 42 -12, 42 28 Z" fill="#a855f7" opacity="0.85"/>
  </g>

  <!-- Center Main User -->
  <g transform="translate(256, 250)">
    <circle cx="0" cy="-60" r="46" fill="#ffffff" filter="url(#glow)"/>
    <path d="M -60 40 C -60 -18, 60 -18, 60 40 Z" fill="#ec4899"/>
  </g>

  <!-- Retro Badge Text -->
  <text x="256" y="420" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="900" letter-spacing="4" fill="#ec4899" text-anchor="middle">2008</text>
</svg>
